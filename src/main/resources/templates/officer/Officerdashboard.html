<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Loan Officer Dashboard - LoanApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .gradient-text {
            background: linear-gradient(135deg, #14b8a6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }
    </style>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen">

<nav class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 px-8 py-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-3">
            <div class="h-10 w-10 bg-gradient-to-tr from-teal-600 to-emerald-600 rounded-xl flex items-center justify-center font-bold text-xl text-white shadow-lg">O</div>
            <span class="text-xl font-bold gradient-text">Loan Officer Portal</span>
        </a>
    </div>
    <button onclick="logout()" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white px-4 py-2 rounded-xl font-semibold transition shadow-lg text-sm">Logout</button>
</nav>

<div class="container mx-auto p-6 md:p-8 space-y-8">
    <div class="bg-slate-800/50 backdrop-blur-xl border border-slate-700 p-6 md:p-8 rounded-2xl shadow-xl">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-lg font-bold text-white">Document Verification Queue</h2>
                <p class="text-xs text-gray-400">Inspect real-time customer documents and run primary checks</p>
            </div>
            <button onclick="fetchOfficerQueue()" class="text-xs bg-slate-700 hover:bg-slate-600 text-gray-300 px-3 py-1.5 rounded-lg border border-slate-600 transition">Refresh Queue</button>
        </div>

        <div class="overflow-x-auto rounded-xl border border-slate-700">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-900/50 border-b border-slate-700 text-xs uppercase tracking-wider text-gray-400">
                    <th class="p-4 font-semibold">Application ID</th>
                    <th class="p-4 font-semibold">Requested Amount</th>
                    <th class="p-4 font-semibold">Tenure</th>
                    <th class="p-4 font-semibold">Income / Expenses</th>
                    <th class="p-4 font-semibold text-right">Verification Action</th>
                </tr>
                </thead>
                <tbody id="officerTableBody" class="divide-y divide-slate-700 text-sm">
                <!-- Real-time rows will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function fetchOfficerQueue() {
        try {
            const response = await fetch('/api/officer/pending-loans');
            if (response.ok) {
                const loans = await response.json();
                const tbody = document.getElementById('officerTableBody');
                tbody.innerHTML = '';

                if (loans.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">No pending verification items found.</td></tr>`;
                    return;
                }

                loans.forEach(loan => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-700/20 transition">
                            <td class="p-4 font-medium text-gray-300">#LN-${loan.id}</td>
                            <td class="p-4 font-semibold text-white">₹${loan.loanAmount.toLocaleString()}</td>
                            <td class="p-4 text-gray-400">${loan.tenureMonths} Months</td>
                            <td class="p-4 text-gray-300">₹${loan.monthlyIncome} / ₹${loan.existingExpenses}</td>
                            <td class="p-4 text-right">
                                <button onclick="verifyAndForward(${loan.id})" class="bg-teal-600/20 text-teal-400 hover:bg-teal-600 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition border border-teal-500/30">Verify & Forward</button>
                            </td>
                        </tr>
                    `;
                });
            }
        } catch (err) {
            console.error('Error fetching officer queue:', err);
        }
    }

    async function verifyAndForward(loanId) {
        try {
            const response = await fetch(`/api/officer/verify/${loanId}`, {
                method: 'POST'
            });
            if (response.ok) {
                alert('Loan verified and forwarded to Manager successfully!');
                fetchOfficerQueue();
            } else {
                alert('Failed to process verification.');
            }
        } catch (err) {
            console.error('Error verifying loan:', err);
        }
    }

    function logout() {
        window.location.href = '/logout';
    }

    fetchOfficerQueue();
</script>
</body>
</html>
