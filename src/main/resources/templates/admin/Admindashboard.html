<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - LoanApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .gradient-text {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }
    </style>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen">

<nav class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 px-8 py-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
        <a href="/admin/dashboard" class="flex items-center gap-3">
            <div class="h-10 w-10 bg-gradient-to-tr from-purple-600 to-indigo-600 rounded-xl flex items-center justify-center font-bold text-xl text-white shadow-lg">A</div>
            <span class="text-xl font-bold gradient-text">Admin Control Center</span>
        </a>
    </div>
    <div class="flex items-center gap-4">
        <a href="/admin/security-keys" class="text-gray-300 hover:text-white transition px-4 py-2 font-medium">Security Keys</a>
        <button onclick="logout()" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white px-4 py-2 rounded-xl font-semibold transition shadow-lg text-sm">Logout</button>
    </div>
</nav>

<div class="container mx-auto p-6 md:p-8 space-y-8">
    <!-- Stats Row -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div class="bg-slate-800/50 backdrop-blur-xl border border-slate-700 p-6 rounded-2xl shadow-lg hover:border-purple-500/30 transition">
            <div class="flex items-center gap-3 mb-2">
                <div class="h-8 w-8 bg-purple-500/20 rounded-lg flex items-center justify-center">
                    <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                </div>
                <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">Total Users</p>
            </div>
            <h3 class="text-2xl font-bold text-white" id="totalUsers">--</h3>
        </div>
        <div class="bg-slate-800/50 backdrop-blur-xl border border-slate-700 p-6 rounded-2xl shadow-lg hover:border-indigo-500/30 transition">
            <div class="flex items-center gap-3 mb-2">
                <div class="h-8 w-8 bg-indigo-500/20 rounded-lg flex items-center justify-center">
                    <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">Loan Volume</p>
            </div>
            <h3 class="text-2xl font-bold text-indigo-400" id="totalLoanVolume">₹0</h3>
        </div>
        <div class="bg-slate-800/50 backdrop-blur-xl border border-slate-700 p-6 rounded-2xl shadow-lg hover:border-emerald-500/30 transition">
            <div class="flex items-center gap-3 mb-2">
                <div class="h-8 w-8 bg-emerald-500/20 rounded-lg flex items-center justify-center">
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">System Health</p>
            </div>
            <h3 class="text-2xl font-bold text-emerald-400" id="systemUptime">99.9% Uptime</h3>
        </div>
        <div class="bg-slate-800/50 backdrop-blur-xl border border-slate-700 p-6 rounded-2xl shadow-lg hover:border-rose-500/30 transition">
            <div class="flex items-center gap-3 mb-2">
                <div class="h-8 w-8 bg-rose-500/20 rounded-lg flex items-center justify-center">
                    <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                </div>
                <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">Security Status</p>
            </div>
            <h3 class="text-2xl font-bold text-rose-400">Secure</h3>
        </div>
    </div>

    <!-- User Management Table -->
    <div class="bg-slate-800/50 backdrop-blur-xl border border-slate-700 p-6 rounded-2xl shadow-xl">
        <h2 class="text-lg font-bold text-white mb-4">User & Role Management</h2>
        <div class="overflow-x-auto rounded-xl border border-slate-700">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-900/50 border-b border-slate-700 text-xs uppercase tracking-wider text-gray-400">
                    <th class="p-4 font-semibold">User ID</th>
                    <th class="p-4 font-semibold">Name</th>
                    <th class="p-4 font-semibold">Email</th>
                    <th class="p-4 font-semibold">Role</th>
                    <th class="p-4 font-semibold text-right">Actions</th>
                </tr>
                </thead>
                <tbody id="adminUserTableBody" class="divide-y divide-slate-700 text-sm">
                <!-- Dynamic real rows will load here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Fetch Real-Time Admin Statistics and Users
    async function fetchAdminData() {
        try {
            // 1. Fetch System Stats / Metrics
            const statsResponse = await fetch('/api/admin/stats');
            if (statsResponse.ok) {
                const stats = await statsResponse.json();
                document.getElementById('totalUsers').innerText = stats.totalUsers || 0;
                document.getElementById('totalLoanVolume').innerText = `₹${(stats.totalLoanVolume || 0).toLocaleString()}`;
                document.getElementById('systemUptime').innerText = stats.uptime || '99.9%';
            }

            // 2. Fetch Real Users List
            const usersResponse = await fetch('/api/admin/users');
            if (usersResponse.ok) {
                const users = await usersResponse.json();
                const tbody = document.getElementById('adminUserTableBody');
                tbody.innerHTML = '';

                if (users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">No users found in database.</td></tr>`;
                    return;
                }

                users.forEach(user => {
                    let roleBadgeColor = 'bg-blue-500/10 text-blue-400 border-blue-500/20';
                    if(user.role === 'ADMIN') roleBadgeColor = 'bg-purple-500/10 text-purple-400 border-purple-500/20';
                    if(user.role === 'MANAGER') roleBadgeColor = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                    if(user.role === 'OFFICER') roleBadgeColor = 'bg-teal-500/10 text-teal-400 border-teal-500/20';

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-700/20 transition">
                            <td class="p-4 font-medium text-gray-300">#USR-${user.id}</td>
                            <td class="p-4 text-white font-medium">${user.fullName || 'N/A'}</td>
                            <td class="p-4 text-gray-400">${user.email}</td>
                            <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-medium border ${roleBadgeColor}">${user.role}</span></td>
                            <td class="p-4 text-right">
                                <button onclick="manageUser(${user.id})" class="text-xs bg-slate-700 hover:bg-slate-600 text-gray-200 px-3 py-1.5 rounded-lg transition">Edit Role</button>
                            </td>
                        </tr>
                    `;
                });
            }
        } catch (err) {
            console.error('Error fetching real-time admin data:', err);
        }
    }

    function manageUser(userId) {
        alert('Opening management panel for User ID: ' + userId);
    }

    function logout() {
        window.location.href = '/logout';
    }

    // Initial call to load data
    fetchAdminData();
</script>
</body>
</html>
